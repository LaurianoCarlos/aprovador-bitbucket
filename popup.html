<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprovador automático</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 390px;
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #172b4d;
      position: relative;
    }

    #closeButton {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #626f86;
      font-size: 22px;
      font-weight: 700;
      line-height: 30px;
      cursor: pointer;
    }

    #closeButton:hover {
      background: #f1f2f4;
      color: #ae2e24;
    }

    h1 {
      margin: 0 36px 6px 0;
      font-size: 19px;
    }

    .subtitle {
      margin: 0 0 14px;
      color: #626f86;
      font-size: 12px;
      line-height: 1.4;
    }

    .status-box {
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f2f4;
      border: 1px solid #dcdfe4;
    }

    .status-title {
      margin-bottom: 4px;
      font-size: 11px;
      color: #626f86;
    }

    #serviceStatus {
      font-size: 15px;
      font-weight: 700;
    }

    #currentState {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.4;
    }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      margin-right: 7px;
      border: 2px solid rgba(23, 43, 77, 0.25);
      border-top-color: #0c66e4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -2px;
    }

    .spinner.visible {
      display: inline-block;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input[type="number"] {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #c1c7d0;
      border-radius: 6px;
      font-size: 14px;
    }

    .hint {
      margin-top: 5px;
      margin-bottom: 13px;
      color: #626f86;
      font-size: 11px;
    }

    #toggleButton {
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #toggleButton.start {
      background: #216e4e;
    }

    #toggleButton.stop {
      background: #ae2e24;
    }

    .flow-title {
      margin-top: 16px;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    #flowLogs {
      max-height: 260px;
      overflow-y: auto;
      padding: 8px 10px;
      border: 1px solid #dcdfe4;
      border-radius: 6px;
      background: #fafbfc;
      font-size: 12px;
      line-height: 1.4;
    }

    .log-row {
      padding: 5px 0;
      border-top: 1px solid #ebecf0;
      word-break: break-word;
    }

    .log-row:first-child {
      border-top: none;
    }

    #message {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <button
    id="closeButton"
    type="button"
    title="Encerrar serviço e fechar"
    aria-label="Encerrar serviço e fechar"
  >
    ×
  </button>

  <h1>Aprovador automático</h1>

  <p class="subtitle">
    Esta tela só aparece quando você clica no ícone da extensão.
  </p>

  <div class="status-box">
    <div class="status-title">Status atual</div>
    <div id="serviceStatus">Carregando...</div>
    <div id="currentState">
      <span id="spinner" class="spinner"></span>
      <span id="currentStateText"></span>
    </div>
  </div>

  <label for="refreshSeconds">
    Atualizar o Google Chat a cada:
  </label>

  <input
    id="refreshSeconds"
    type="number"
    min="5"
    max="3600"
    step="1"
    value="10"
  >

  <div class="hint">
    Informe um valor entre 5 e 3600 segundos.
  </div>

  <label for="maxUrls">
    Quantas URLs processar:
  </label>

  <input
    id="maxUrls"
    type="number"
    min="1"
    max="100"
    step="1"
    value="5"
  >

  <div class="hint">
    Sempre serão usadas as últimas URLs visíveis na tela.
  </div>

  <button id="toggleButton" type="button" class="start">
    Iniciar serviço
  </button>

  <div class="flow-title">Fluxo do processamento</div>
  <div id="flowLogs">Nenhuma ação executada.</div>

  <div id="message"></div>

  <script src="popup.js"></script>
</body>
</html>
